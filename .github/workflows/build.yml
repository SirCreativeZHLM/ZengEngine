name: build
on:
  push: { branches: [main], tags: ["v*"] }
  pull_request:
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - name: Package
        shell: bash
        run: scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ZengEngine-${{ runner.os }}
          path: |
            dist/*.zip
            dist/*.tar.gz
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with: { files: "out/*", generate_release_notes: true }
