[package]
name = "zeng-player"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
bevy = { version = "0.20", features = ["wav", "mp3", "flac"] }
avian3d = { version = "0.8", default-features = false, features = ["3d", "parry-f32", "parallel", "collider-from-mesh", "bevy_scene"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
